spring.application.name=deliveryya
spring.datasource.url=${DB_URL}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
####
####
#app.cors.origin=http://localhost:3000
app.cors.origin=https://www.deliveryya.lk
app.jwt.secret=${APP_JWT_SECRET}
app.email.verify.secret=${APP_EMAIL_VERIFY_SECRET}
app.upload.path=${UPLOAD_PATH:uploads}
####
####
####
# Mail configuration (Gmail SMTP)
# Mail configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# SMS API Configuration (SMSlenz)
sms.api.base-url=https://smslenz.lk/api
sms.api.user-id=${SMS_USER_ID:2579}
sms.api.api-key=${SMS_API_KEY}
sms.api.sender-id=${SMS_SENDER_ID:DeliveryYa}

